<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leading University Cover Page Generator</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
        }

        /* Control Panel Form Style */
        .form-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 350px;
        }

        .form-container h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 5px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        .print-btn {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .print-btn:hover {
            background-color: #004085;
        }

        /* Cover Page Preview Style (A4 Size Fixed) */
        .cover-page {
            background: white;
            width: 210mm;
            height: 297mm; /* Fixed height jate page cross na kore */
            padding: 20mm 20mm;
            box-sizing: border-box;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden; /* Extra content hide rakhbe */
        }

        .header-section {
            text-align: center;
        }

        .logo-area img {
            width: 65px; /* Logo-er size nirdisto kore dewa holo jate boro na hoy */
            height: auto;
            margin-bottom: 3px;
        }

        .university-name {
            font-size: 21px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin: 4px 0;
            color: #111;
        }

        .dept-title {
            font-size: 15px;
            font-weight: bold;
            margin: 2px 0;
        }

        .dept-name {
            font-size: 17px;
            font-weight: bold;
            margin: 4px 0 10px 0;
        }

        .course-info {
            font-size: 14px;
            font-weight: bold;
            margin: 5px 0;
            line-height: 1.3;
        }

        /* Table Section */
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .info-table th, .info-table td {
            border: 1px solid #000;
            padding: 10px 12px;
            vertical-align: top;
            font-size: 13.5px;
            line-height: 1.4;
        }

        .info-table th {
            text-align: center;
            font-weight: bold;
            background-color: #fafafa;
        }

        .footer-date {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        /* Print Media Settings */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .form-container {
                display: none;
            }
            .cover-page {
                box-shadow: none;
                margin: 0;
                width: 100%;
                height: 100vh;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="form-container">
        <h2>Cover Page Information</h2>
        
        <div class="form-group">
            <label>Course Code:</label>
            <input type="text" id="input-course-code" placeholder="e.g. CSE-1151" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Course Title:</label>
            <input type="text" id="input-course-title" placeholder="e.g. Discrete Mathematics" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Assignment / Topic:</label>
            <input type="text" id="input-assignment" placeholder="e.g. Assignment-01: Graph & Tree" oninput="updatePreview()">
        </div>

        <hr style="margin: 15px 0; border:0; border-top:1px solid #ddd;">
        <h3 style="font-size: 15px; margin-bottom: 10px; color:#444;">Submitted By (Your Info)</h3>

        <div class="form-group">
            <label>Name:</label>
            <input type="text" id="input-my-name" placeholder="Your Name Here" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>ID:</label>
            <input type="text" id="input-my-id" placeholder="Your ID Here" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Section:</label>
            <input type="text" id="input-my-section" placeholder="Section Here" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Batch:</label>
            <input type="text" id="input-my-batch" placeholder="Batch Here" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Department:</label>
            <input type="text" id="input-my-dept" placeholder="CSE" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Session:</label>
            <input type="text" id="input-my-session" placeholder="e.g. Fall 2026" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>E-mail:</label>
            <input type="text" id="input-my-email" placeholder="Your Email Here" oninput="updatePreview()">
        </div>

        <hr style="margin: 15px 0; border:0; border-top:1px solid #ddd;">
        <h3 style="font-size: 15px; margin-bottom: 10px; color:#444;">Submitted To (Teacher Info)</h3>

        <div class="form-group">
            <label>Teacher Name:</label>
            <input type="text" id="input-teacher-name" placeholder="Teacher Name Here" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Designation:</label>
            <input type="text" id="input-teacher-desig" placeholder="e.g. Lecturer" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>University / Office:</label>
            <input type="text" id="input-teacher-uni" placeholder="Leading University, Sylhet" oninput="updatePreview()">
        </div>
        <div class="form-group">
            <label>Teacher E-mail:</label>
            <input type="text" id="input-teacher-email" placeholder="Teacher Email Here" oninput="updatePreview()">
        </div>

        <div class="form-group">
            <label>Submission Date:</label>
            <input type="text" id="input-date" placeholder="DD/MM/YYYY" oninput="updatePreview()">
        </div>

        <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
    </div>

    <!-- Cover Page Preview -->
    <div class="cover-page">
        <div class="header-section">
            <div class="logo-area">
                <!-- Ekhane apnar logo.png ba link thakbe -->
                <img src="./LU_L.png" alt="Leading University Logo">
            </div>
            <div class="university-name">LEADING UNIVERSITY</div>
            <div class="dept-title">Department</div>
            <div class="dept-name">Computer Science & Engineering</div>
            
            <div class="course-info" id="preview-course-code">Course Code: </div>
            <div class="course-info" id="preview-course-title">Course Title: </div>
            <div class="course-info" id="preview-assignment"></div>
        </div>

        <table class="info-table">
            <thead>
                <tr>
                    <th style="width: 50%;">Submitted By</th>
                    <th style="width: 50%;">Submitted To</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <strong>Name:</strong> <span id="prev-my-name"></span><br>
                        <strong>ID:</strong> <span id="prev-my-id"></span><br>
                        <strong>Section:</strong> <span id="prev-my-section"></span><br>
                        <strong>Batch:</strong> <span id="prev-my-batch"></span><br>
                        <strong>Department:</strong> <span id="prev-my-dept"></span><br>
                        <strong>Session:</strong> <span id="prev-my-session"></span><br>
                        <strong>E-mail:</strong> <span id="prev-my-email"></span>
                    </td>
                    <td>
                        <strong>Name:</strong> <span id="prev-teacher-name"></span><br>
                        <strong>Designation:</strong> <span id="prev-teacher-desig"></span><br>
                        <span id="prev-teacher-uni"></span><br>
                        <strong>E-mail:</strong><br><span id="prev-teacher-email"></span>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="footer-date">
            Submission Date: <span id="prev-date"></span>
        </div>
    </div>

    <script>
        function updatePreview() {
            let cCode = document.getElementById('input-course-code').value;
            document.getElementById('preview-course-code').innerText = cCode ? "Course Code: " + cCode : "";

            let cTitle = document.getElementById('input-course-title').value;
            document.getElementById('preview-course-title').innerText = cTitle ? "Course Title: " + cTitle : "";

            document.getElementById('preview-assignment').innerText = document.getElementById('input-assignment').value;

            document.getElementById('prev-my-name').innerText = document.getElementById('input-my-name').value;
            document.getElementById('prev-my-id').innerText = document.getElementById('input-my-id').value;
            document.getElementById('prev-my-section').innerText = document.getElementById('input-my-section').value;
            document.getElementById('prev-my-batch').innerText = document.getElementById('input-my-batch').value;
            document.getElementById('prev-my-dept').innerText = document.getElementById('input-my-dept').value;
            document.getElementById('prev-my-session').innerText = document.getElementById('input-my-session').value;
            document.getElementById('prev-my-email').innerText = document.getElementById('input-my-email').value;

            document.getElementById('prev-teacher-name').innerText = document.getElementById('input-teacher-name').value;
            document.getElementById('prev-teacher-desig').innerText = document.getElementById('input-teacher-desig').value;
            document.getElementById('prev-teacher-uni').innerText = document.getElementById('input-teacher-uni').value;
            document.getElementById('prev-teacher-email').innerText = document.getElementById('input-teacher-email').value;

            document.getElementById('prev-date').innerText = document.getElementById('input-date').value;
        }
    </script>
</body>
</html>
